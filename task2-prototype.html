<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zanko Reporting — Scheduled Reports Prototype</title>
<link rel="stylesheet" href="proto.css">
<link rel="stylesheet" href="task2.css">
</head>
<body>
<!-- ============================================================
     Scheduled Reports prototype (Task 2).

     Beginner note: like the Task 1 prototype, this file is only
     the static shell — task2.js renders the three views (list,
     create, approve) into #view from the data at the top of that
     file.

     Business note: the sidebar and page header replicate Zanko's
     current Reporting screen (Reports nav item active, Dashboards
     and Reports tabs). The one addition is the Schedules tab —
     the feature grows out of the existing Reporting area rather
     than becoming a new module.
     ============================================================ -->
<!-- Demo chrome: state switcher + rationale pins -->
<div class="demo-bar">
  <span class="lbl">SHOW ME:</span>
  <span id="demo-scenarios"></span>
  <span class="sep"></span>
  <button onclick="document.body.classList.toggle('show-new'); this.classList.toggle('on')" style="color:#f3a09a">What's new</button>
  <a href="task2.html" style="color:#c9c9d2">← Framing</a>
</div>
<div class="app">

  <!-- Left sidebar: as on the current Reporting screenshot -->
  <aside class="sidebar">
    <div class="logo"><span class="spark">✦</span> zanko</div>
    <div class="workspace">
      <span class="ws-badge">CMS</span>
      <div><small>Workspace</small>Complaint</div>
    </div>
    <div class="nav-item"><span class="ico">🏠</span> Home <span class="badge">Sunsetting</span></div>
    <div class="nav-item"><span class="ico">📋</span> Complaints</div>
    <div class="nav-item active"><span class="ico">📊</span> Reports</div>
    <div class="nav-item nav-sub">CMS Insights Dashb…</div>
    <div class="nav-item"><span class="ico">📄</span> Complaint Handling Policy</div>
    <div class="nav-item"><span class="ico">📈</span> Analysis <span class="badge">Sunsetting</span></div>
    <div class="nav-item"><span class="ico">⚡</span> Workflow Automation <span class="badge">Beta</span></div>
    <div class="nav-item"><span class="ico">⚙️</span> Settings</div>
    <button class="ask-zanko-side">✦ Ask Zanko</button>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="ask-zanko-top">✦ Ask Zanko</button>
      <span>🔔</span>
      <div class="avatar">ZA</div>
    </div>

    <!-- Reporting header: existing tabs + the new Schedules tab (R8) -->
    <div class="page-head" style="position:relative">
      <h1>Reporting<span class="beta">Beta</span></h1>
      <nav class="tabs">
        <a href="#" onclick="return false">Dashboards</a>
        <a href="#" onclick="return false">Reports</a>
        <a href="#" onclick="return false" class="on" style="position:relative" data-new="NEW tab">Schedules</a>
      </nav>
    </div>

    <!-- task2.js renders the current view (list / create / approve) here -->
    <div class="page-body" id="view" data-new="NEW — everything in this tab is the feature"></div>
  </div>
</div>


<script src="task2.js"></script>
</body>
</html>
